version: 2

project_name: prpr

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    # Scoop's autoupdate manifest interpolates this exact shape, so the
    # template and the entry in kanywst/scoop-bucket have to agree.
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    # Windows packaging tools expect a zip; handing Scoop a .tar.gz makes the
    # download the hardest step of the install.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README.ja.md
      - LICENSE

checksum:
  # Named after the project so Scoop's autoupdate can find it by version.
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

# `brews` (Homebrew formulas) is deprecated in goreleaser v2; casks are what it
# generates for pre-compiled binaries now, and Casks/ is where the rest of
# kanywst/homebrew-tap keeps this kind of tool.
homebrew_casks:
  - name: prpr

    binaries:
      - prpr

    # Casks are downloaded with curl, so macOS tags the payload with
    # com.apple.quarantine and Gatekeeper refuses to run it. Stripping the
    # attribute is the path goreleaser documents, but its `hooks:` option emits
    # the legacy Ruby `postflight do` block, which Homebrew deprecated (it warns
    # on every `brew` invocation). `custom_block` is the only way to emit the
    # declarative replacement, `postflight_steps`, from here.
    # The braces are escaped because goreleaser templates this value and
    # {{staged_path}} is a Homebrew install-time token, not a Go template field.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/prpr"]
        end
      end

    # HOMEBREW_TAP_GITHUB_TOKEN is a PAT with write access to the tap; the
    # release workflow passes it through.
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

    directory: Casks

    url:
      template: "https://github.com/kanywst/prpr/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    # Not goreleaser's own maintainer address, which is what its docs example
    # uses and what gets copied around: these commits land in this account's
    # tap and should not be attributed to a third party.
    commit_author:
      name: goreleaserbot
      email: noreply@github.com

    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

    homepage: "https://github.com/kanywst/prpr"
    # Homebrew's audit rules reject a leading article, a trailing period, and a
    # description that repeats the cask name, and cap it at 80 characters.
    description: "Terminal dashboard for the open GitHub pull requests you can see"

    # Keeps prereleases out of the tap; tagged releases still publish.
    skip_upload: auto

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
