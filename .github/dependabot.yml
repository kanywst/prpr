version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The Charm libraries move together; a split upgrade tends not to build.
      charm:
        patterns:
          - charm.land/*
          - github.com/charmbracelet/*
      go-deps:
        patterns:
          - "*"
        exclude-patterns:
          - charm.land/*
          - github.com/charmbracelet/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
