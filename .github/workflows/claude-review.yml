name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.
#
# "It does not gate" is about findings, not about delivery. A run that reviews
# and then cannot post what it found is indistinguishable from a clean diff,
# and the check is green either way. The last step here fails when that
# happens, for the same reason the token check fails rather than reviewing
# nothing quietly.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review the diff
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Drafts are skipped until
    # they are marked ready, which is what the ready_for_review trigger is for.
    #
    # Dependabot is skipped for the same reason as a fork: a run it triggers
    # reads Dependabot secrets, not Actions secrets, so the token is empty no
    # matter what is configured here. A version bump is also the diff this
    # review has least to say about.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write  # post the summary and the inline findings
      issues: read  # the delivery check reads conversation comments, served from the issues endpoint
      id-token: write  # required by the action's default GitHub App authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      # Anything the review posts has to be newer than this, or it is a
      # leftover from an earlier push and says nothing about this diff. Two
      # minutes of slack absorbs clock skew between the runner and the API.
      - name: Mark the start of this review
        id: started
        run: echo "at=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        id: claude
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            prpr is a terminal dashboard for the open GitHub pull requests across every
            owner the viewer can see: their own account plus each org they belong to,
            discovered at startup rather than configured. It is built on Bubble Tea v2
            (imported as charm.land/bubbletea/v2), Bubbles v2 and Lip Gloss v2, and it
            borrows the gh CLI's stored credentials through go-gh.

            Layout: internal/gh is the domain type (PR) and the GraphQL adapter,
            internal/browser is the one OS-dependent side effect, internal/ui is the
            MVU loop, split into pure helpers (format.go, tabs.go, theme.go) and state
            (model.go, update.go, view.go). ui.Fetcher is declared at the point of use so
            the whole model is drivable in tests without network access.

            Do not repeat what CI already does. go vet, golangci-lint v2, the race tests on
            Linux/macOS/Windows, the five-target cross-compile, the go mod tidy check and
            markdownlint all run on this PR already.

            Look for what only a reader can catch:

            1. Layout arithmetic. Model.metrics is the single source of truth for how many
               lines each section occupies, and View must draw exactly that many. A section
               that renders one line more or fewer than metrics reserved pushes the footer
               out of the frame or silently truncates the list, and nothing in the type
               system catches it. listTop in update.go encodes the same stacking order for
               mouse hit-testing: if one moves and the other does not, clicks land on the
               wrong row.

            2. Width measurement. Every string that reaches the screen must be sized with
               truncate/pad, which are ANSI- and wide-rune-aware. len(), utf8.RuneCount, or
               arithmetic on a styled string overflows the frame the moment an emoji or a
               Japanese title goes through it. Lip Gloss counts the border inside
               Style.Width, which is why the frame is deliberately not given explicit
               dimensions; re-adding them reintroduces the double-count.

            3. MVU discipline. Update returns a new Model by value. A tea.Cmd must capture
               only the fields it needs, never the model, and must never write to it: the
               command runs on another goroutine. applySize has to run after anything that
               changes the layout, including the farewell band growing or shrinking, or the
               child bubbles keep stale dimensions.

            4. Refresh invariants. refreshDue must stay false while a fetch is in flight,
               while the terminal is unfocused, and before the first successful fetch. A
               path that leaves lastFetch zero after an error turns the retry into a tight
               loop against the GitHub API, which is a rate-limit incident, not a bug report.

            5. Merge detection. Farewells come from diffing consecutive refreshes. That diff
               must not run on the first fetch (everything would look new), must key on
               PR.Key rather than the number alone, and a failed State lookup must degrade
               to a neutral goodbye rather than surfacing an error.

            6. Bubble Tea v2 idioms. Terminal features (alt screen, mouse mode, focus
               reporting, window title, cursor) belong on the tea.View returned from View,
               not on program options or commands, which is how v2 differs from v1. Key
               handling matches tea.KeyPressMsg, not tea.KeyMsg.

            7. GraphQL nullability. author, reviewDecision and statusCheckRollup are all
               nullable, and search(type: ISSUE) returns zero-valued nodes for hits that are
               not pull requests. gh/convert.go is the only place allowed to know that;
               a nil check that migrates outward is a sign the boundary leaked.

            8. User-facing text is Japanese. New strings should match the existing tone, and
               must be measured with the same width helpers as everything else.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

            Write the summary to a file and post it with
            `gh pr comment --body-file <path>`. A body built inline from a
            heredoc or a command substitution does not match the allowlist and
            is refused, which loses the whole review.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The check below keys off the action's conclusion output. Print what it
      # was, so a run that fails when it should not - or does not when it
      # should - can be diagnosed from the log rather than by guessing.
      - name: Report the review outcome
        if: always()
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          echo "action conclusion: '${CONCLUSION}'"
          echo "execution file:    '${EXECUTION_FILE}'"

      # A review that runs, is refused a tool call on the way to posting, and
      # exits green leaves the pull request unreviewed behind a passing check.
      # Write is allowed above so a long summary can go to a file and out
      # through `gh pr comment --body-file`, which is the shape the allowlist
      # matches; this catches it when something is refused anyway.
      #
      # Silence on its own is not the signal. A follow-up push whose review had
      # nothing to add to what is already on the pull request posts nothing and
      # denies nothing, and that is fine. The failure is silence *with* a
      # refusal behind it. An unreadable denial count is treated as a refusal,
      # because the whole point is not to call a pull request reviewed on the
      # strength of a green check.
      - name: Fail on a review that was not delivered
        if: always() && steps.claude.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          # The action's default bot_name, which this workflow does not override.
          BOT: claude[bot]
        run: |
          set -euo pipefail
          fresh() {
            gh api --paginate "$1" --jq \
              "[.[] | select(.user.login == \"$BOT\") | select((.$2 // \"\") >= \"$SINCE\")] | length" |
              awk '{ n += $1 } END { print n + 0 }'
          }
          summary=$(fresh "repos/$REPO/issues/$PR/comments" updated_at)
          inline=$(fresh "repos/$REPO/pulls/$PR/comments" updated_at)
          reviews=$(fresh "repos/$REPO/pulls/$PR/reviews" submitted_at)
          total=$((summary + inline + reviews))
          echo "posted since $SINCE: $summary summary, $inline inline, $reviews review(s)"
          if [ "$total" -gt 0 ]; then
            exit 0
          fi

          denials=unknown
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            denials=$(jq -r '[.. | objects | select(.type? == "result") | .permission_denials_count?]
              | map(select(. != null)) | last // 0' "$EXECUTION_FILE" 2>/dev/null || echo unknown)
          fi
          echo "denied tool calls: $denials"
          if [ "$denials" = "0" ]; then
            echo "::notice::The review posted nothing and nothing was refused, so it had nothing to add to what is already on this pull request."
            exit 0
          fi
          echo "::error::The review ran, was refused a tool call ($denials), and posted nothing, so this pull request is unreviewed despite a green check. Widen --allowedTools above."
          exit 1
