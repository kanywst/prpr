name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # cosign signs the checksums keylessly with this workflow's OIDC identity.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads the tag history to build the changelog, so the
          # shallow default will not do.
          fetch-depth: 0
          # goreleaser authenticates to the API with GITHUB_TOKEN below; it
          # never pushes over the checkout's credentials.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # goreleaser shells out to both: syft for the SBOMs, cosign to sign.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser publishes the GitHub release before it pushes the cask, so a
      # missing tap token would fail the run *after* the binaries are already
      # out, and recovering from that needs a fresh tag. Drop the cask instead:
      # the release still ships, Scoop is unaffected (the bucket updates itself
      # from the published assets and needs no token here), and the warning
      # says what is missing.
      - name: Decide whether the cask can be published
        id: tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is not set, so this release ships without a Homebrew cask. Set a PAT with write access to kanywst/homebrew-tap and cut another tag: gh secret set HOMEBREW_TAP_GITHUB_TOKEN --repo kanywst/prpr"
            echo "args=release --clean --skip=homebrew" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: ${{ steps.tap.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with write access to kanywst/homebrew-tap. GITHUB_TOKEN above
          # is scoped to this repository and cannot push the cask. The fallback
          # keeps the cask's token template renderable on the skipped path; it
          # never authenticates anything, because the step is skipped.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || 'unset-cask-is-skipped' }}
